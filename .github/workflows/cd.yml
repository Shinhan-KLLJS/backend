name: CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Actions 탭에서 브랜치 선택 후 수동 실행 (dev 테스트용)

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # latest는 편의용 별칭일 뿐 배포 대상은 항상 commit SHA 태그로 고정한다 -
          # latest만 쓰면 롤백 시 "이전 이미지"를 가리킬 안정적인 참조가 없다.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/klljs-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/klljs-app:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # EC2가 private subnet(SSH 불가)에 있어서 SSM Run Command로 배포 명령 전달
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Find EC2 instance ID
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=vision-spring-ec2" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ]; then
            echo "Running EC2 instance not found" >&2
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM Run Command
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/klljs-app:${{ github.sha }}
        run: |
          cat > deploy_script.sh <<SCRIPT
          set -e
          DB_URL=\$(aws ssm get-parameter --name /vision/prod/db-url --query Parameter.Value --output text --region ap-northeast-2)
          DB_USERNAME=\$(aws ssm get-parameter --name /vision/prod/db-username --query Parameter.Value --output text --region ap-northeast-2)
          DB_PASSWORD=\$(aws ssm get-parameter --name /vision/prod/db-password --with-decryption --query Parameter.Value --output text --region ap-northeast-2)
          KAKAO_REST_API_KEY=\$(aws ssm get-parameter --name /vision/prod/kakao-rest-api-key --query Parameter.Value --output text --region ap-northeast-2)
          KAKAO_CLIENT_SECRET=\$(aws ssm get-parameter --name /vision/prod/kakao-client-secret --with-decryption --query Parameter.Value --output text --region ap-northeast-2)
          KAKAO_REDIRECT_URI=\$(aws ssm get-parameter --name /vision/prod/kakao-redirect-uri --query Parameter.Value --output text --region ap-northeast-2)
          APP_FRONTEND_URL=\$(aws ssm get-parameter --name /vision/prod/app-frontend-url --query Parameter.Value --output text --region ap-northeast-2)
          REFRESH_COOKIE_SAME_SITE=\$(aws ssm get-parameter --name /vision/prod/refresh-cookie-same-site --query Parameter.Value --output text --region ap-northeast-2)
          JWT_SECRET=\$(aws ssm get-parameter --name /vision/prod/jwt-secret --with-decryption --query Parameter.Value --output text --region ap-northeast-2)
          VISION_SQS_QUEUE_URL=\$(aws ssm get-parameter --name /vision/prod/sqs-queue-url --query Parameter.Value --output text --region ap-northeast-2)
          CAMPAIGN_CREATIVE_BUCKET=\$(aws ssm get-parameter --name /vision/prod/campaign-creative-bucket --query Parameter.Value --output text --region ap-northeast-2)
          CAMPAIGN_CREATIVE_PUBLIC_BASE_URL=\$(aws ssm get-parameter --name /vision/prod/campaign-creative-public-base-url --query Parameter.Value --output text --region ap-northeast-2)
          CAMPAIGN_CREATIVE_UPLOAD_TOKEN_SECRET=\$(aws ssm get-parameter --name /vision/prod/campaign-creative-upload-token-secret --with-decryption --query Parameter.Value --output text --region ap-northeast-2)
          BUSINESS_REGISTRATION_UPLOAD_TOKEN_SECRET=\$(aws ssm get-parameter --name /vision/prod/business-registration-upload-token-secret --with-decryption --query Parameter.Value --output text --region ap-northeast-2)
          BUSINESS_REGISTRATION_BUCKET=\$(aws ssm get-parameter --name /vision/prod/business-registration-bucket --query Parameter.Value --output text --region ap-northeast-2)
          BUSINESS_REGISTRATION_OCR_FUNCTION=\$(aws ssm get-parameter --name /vision/prod/business-registration-ocr-function --query Parameter.Value --output text --region ap-northeast-2)

          MARKER_FILE=/tmp/klljs_current_image
          PREVIOUS_IMAGE=\$(cat "\$MARKER_FILE" 2>/dev/null || echo "")

          run_app() {
            local image="\$1"
            docker run -d --name klljs-app --restart unless-stopped -p 8080:8080 \
              -e SPRING_DATASOURCE_URL="\$DB_URL" \
              -e SPRING_DATASOURCE_USERNAME="\$DB_USERNAME" \
              -e SPRING_DATASOURCE_PASSWORD="\$DB_PASSWORD" \
              -e KAKAO_REST_API_KEY="\$KAKAO_REST_API_KEY" \
              -e KAKAO_CLIENT_SECRET="\$KAKAO_CLIENT_SECRET" \
              -e KAKAO_REDIRECT_URI="\$KAKAO_REDIRECT_URI" \
              -e APP_FRONTEND_URL="\$APP_FRONTEND_URL" \
              -e REFRESH_COOKIE_SAME_SITE="\$REFRESH_COOKIE_SAME_SITE" \
              -e JWT_SECRET="\$JWT_SECRET" \
              -e VISION_SQS_QUEUE_URL="\$VISION_SQS_QUEUE_URL" \
              -e CAMPAIGN_CREATIVE_BUCKET="\$CAMPAIGN_CREATIVE_BUCKET" \
              -e CAMPAIGN_CREATIVE_PUBLIC_BASE_URL="\$CAMPAIGN_CREATIVE_PUBLIC_BASE_URL" \
              -e CAMPAIGN_CREATIVE_UPLOAD_TOKEN_SECRET="\$CAMPAIGN_CREATIVE_UPLOAD_TOKEN_SECRET" \
              -e BUSINESS_REGISTRATION_UPLOAD_TOKEN_SECRET="\$BUSINESS_REGISTRATION_UPLOAD_TOKEN_SECRET" \
              -e BUSINESS_REGISTRATION_BUCKET="\$BUSINESS_REGISTRATION_BUCKET" \
              -e BUSINESS_REGISTRATION_OCR_FUNCTION="\$BUSINESS_REGISTRATION_OCR_FUNCTION" \
              "\$image"
          }

          # 90초 예산. 60초로 뒀을 때 실제 배포에서 두 번이나 "헬스체크 실패"로 오탐이 났다 -
          # 앱이 죽은 게 아니라 Hibernate/Flyway 부트스트랩이 70초 넘게 걸린 것뿐이었는데,
          # 스크립트가 성급하게 포기하고 롤백을 시도해 오히려 사고로 번졌다 (2026-07-14,
          # 아래 롤백 관련 주석 참고). 실측 70초에 여유를 더했다.
          #
          # 횟수 고정 루프(45 x 2초) 대신 SECONDS 기준 절대 데드라인을 쓴다 - curl 자체가
          # 느려지면(예: 커넥션은 됐는데 응답이 안 옴) 횟수 기반 루프는 실제로 90초를 훨씬
          # 넘겨 돌 수 있다. curl에도 개별 타임아웃(연결 3초, 전체 5초)을 둬서 한 번의 느린
          # 요청이 데드라인 감시 자체를 오래 막지 못하게 한다.
          wait_for_health() {
            local deadline=\$((SECONDS + 90))
            while [ "\$SECONDS" -lt "\$deadline" ]; do
              if curl -sf --connect-timeout 3 --max-time 5 http://localhost:8080/actuator/health >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          docker pull ${DOCKER_IMAGE}
          docker stop klljs-app || true
          docker rm klljs-app || true
          run_app "${DOCKER_IMAGE}"

          if wait_for_health; then
            echo "Health check passed for ${DOCKER_IMAGE}"
            echo "${DOCKER_IMAGE}" > "\$MARKER_FILE"
          else
            echo "Health check failed for ${DOCKER_IMAGE}, dumping container logs:" >&2
            docker logs klljs-app --tail 200 >&2 || true
            docker stop klljs-app || true
            docker rm klljs-app || true

            # 주의: 이 롤백은 "이전 이미지 == 이전 DB 스키마"를 전제한다. 실패한 배포에
            # DROP COLUMN/DROP TABLE 같은 되돌릴 수 없는 Flyway 마이그레이션이 포함돼 있었다면
            # (Flyway는 이미 커밋했으므로 DB는 새 스키마로 남아있고), 이전 이미지는 그 스키마를
            # validate하지 못해 즉시 크래시한다 - 실제로 2026-07-14에 이 경로로 서비스가
            # 다운됐다(missing column [rejection_reason]). 이런 배포는 애초에 자동 롤백으로
            # 복구가 안 되니, 컬럼/테이블을 지우는 마이그레이션이 낀 배포가 헬스체크에 실패하면
            # 사람이 직접 판단해야 한다(새 이미지를 더 오래 기다려보거나, 수동 보정 마이그레이션 작성).
            if [ -n "\$PREVIOUS_IMAGE" ]; then
              echo "Rolling back to previous image: \$PREVIOUS_IMAGE" >&2
              docker pull "\$PREVIOUS_IMAGE" || true
              run_app "\$PREVIOUS_IMAGE"
              if wait_for_health; then
                echo "Rollback to \$PREVIOUS_IMAGE succeeded" >&2
              else
                echo "Rollback to \$PREVIOUS_IMAGE also failed health check - stopping it instead of leaving a crash loop" >&2
                docker logs klljs-app --tail 200 >&2 || true
                docker rm -f klljs-app || true
                if [ -n "\$(docker ps -a -q --filter name=klljs-app)" ]; then
                  echo "Failed to remove the crashed rollback container - it may still be restart-looping, check manually" >&2
                else
                  echo "Service is now fully down (no container running) - needs manual recovery" >&2
                fi
              fi
            else
              echo "No previous image recorded, cannot roll back automatically" >&2
            fi
            exit 1
          fi
          SCRIPT

          PARAMS=$(jq -Rs '{"commands": [.]}' deploy_script.sh)
          echo "$PARAMS" > params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy klljs-app" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "Command ID: $COMMAND_ID"

          # aws ssm wait command-executed는 내부 대기 시간(약 100초)이 고정돼 있는데,
          # 이 배포 스크립트는 이미지 pull까지 포함하면 2분 넘게 걸릴 때가 있다. 그러면
          # 명령 자체는 나중에 Success로 끝나는데도 워크플로우는 InProgress 상태에서
          # 이미 시간 초과로 실패 처리되는 오탐이 발생한다(2026-07-13 CD 실행에서 실제로
          # 발생 - 명령은 2분 3초 후 Success였지만 워크플로우는 그 전에 실패 처리됨).
          # 그래서 고정 waiter 대신 자체 폴링 루프로 대체하고 대기 시간을 넉넉하게 잡는다.
          # 최악의 경우(새 이미지 헬스체크 실패 + 롤백도 실패) pull(~20s) + wait_for_health
          # 1차(최대 90s) + 정리(~10s) + pull(~10s) + wait_for_health 2차(최대 90s)로
          # 220초 안팎까지 걸릴 수 있어 300초로는 빠듯하다 - 420초로 여유를 둔다.
          MAX_WAIT_SECONDS=420
          POLL_INTERVAL_SECONDS=5
          ELAPSED=0
          STATUS="Pending"

          while true; do
            sleep "$POLL_INTERVAL_SECONDS"
            ELAPSED=$((ELAPSED + POLL_INTERVAL_SECONDS))

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.ec2.outputs.instance_id }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Deploy status after ${ELAPSED}s: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut)
                break
                ;;
            esac

            if [ "$ELAPSED" -ge "$MAX_WAIT_SECONDS" ]; then
              echo "Timed out after ${MAX_WAIT_SECONDS}s waiting for deploy command to finish (last status: $STATUS)" >&2
              # 로컬 폴링만 포기하는 거고 원격 SSM 명령은 인스턴스에서 계속 돈다 - 그대로 두면
              # 나중에 재시도한 배포와 동시에 docker stop/rm/run을 실행해 서로 꼬일 수 있다.
              # 취소해서 다음 배포가 깨끗한 상태에서 시작하게 한다.
              aws ssm cancel-command \
                --command-id "$COMMAND_ID" \
                --instance-ids "${{ steps.ec2.outputs.instance_id }}" || true
              break
            fi
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}"

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
