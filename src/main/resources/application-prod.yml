server:
  # ALB가 443(HTTPS)을 받아 EC2에는 8080(HTTP)으로 전달한다.
  # X-Forwarded-Proto 등을 신뢰하지 않으면 앱이 스스로를 http로 착각해
  # springdoc의 servers URL 등 자기 자신을 가리키는 절대 URL이 http://로 잘못 생성된다.
  forward-headers-strategy: framework

spring:
  flyway:
    enabled: true # db/migration의 SQL로 스키마 관리 (Hibernate는 검증만 함)

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 배포 환경(SSM Run Command)에서 RDS 접속 정보를 환경변수로 주입
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate # 운영 DB 스키마는 앱이 바꾸지 않음 (마이그레이션 도구/수동 SQL로 관리)
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI}
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image
              - account_email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-info-authentication-method: header
            user-name-attribute: id

app:
  frontend-url: ${APP_FRONTEND_URL}
  swagger-origin: ${APP_SWAGGER_ORIGIN:https://api.loovi.my}

  auth:
    jwt:
      issuer: klljs
      secret: ${JWT_SECRET}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 1209600

  nts:
    # 운영은 기본값이 없다. 값이 없으면 사업자등록증 검증이 500으로 막히므로 배포 시 반드시 주입한다.
    service-key: ${NTS_SERVICE_KEY}

  upload:
    business-registration:
      # 전부 기본값이 없다 - 주입하지 않으면 기동 자체가 실패한다. 조용히 잘못된 값으로 뜨는 것보다
      # 배포가 실패하는 편이 낫다 (토큰 시크릿이 비면 업로드 토큰을 아무나 위조할 수 있다).
      #
      # 토큰 시크릿을 교체하면 최대 1시간(token-ttl-seconds) 동안 기존 업로드 토큰이 무효가 되어
      # 그 사이 팀 생성을 시도하던 사용자는 재업로드해야 한다 - 교체는 사용량이 적은 시간대에 한다.
      token-secret: ${BUSINESS_REGISTRATION_UPLOAD_TOKEN_SECRET}
      bucket: ${BUSINESS_REGISTRATION_BUCKET}
      ocr-function-name: ${BUSINESS_REGISTRATION_OCR_FUNCTION}

      # 참조 없는 사업자등록증 파일 정리 배치는 운영에서만 켠다.
      # 민감 문서를 실제로 삭제하므로 로컬/테스트에서 우연히 도는 일이 없어야 한다.
      cleanup:
        enabled: true

  vision:
    sqs:
      queue-url: ${VISION_SQS_QUEUE_URL}
      consumer-enabled: true

logging:
  level:
    root: info
