spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # docker-compose.prod.yml / 배포 환경에서 RDS 접속 정보를 환경변수로 주입
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate # 운영 DB 스키마는 앱이 바꾸지 않음 (마이그레이션 도구/수동 SQL로 관리)
    show-sql: false

logging:
  level:
    root: info
