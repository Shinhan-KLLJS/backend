server:
  # ALB가 443(HTTPS)을 받아 EC2에는 8080(HTTP)으로 전달한다.
  # X-Forwarded-Proto 등을 신뢰하지 않으면 앱이 스스로를 http로 착각해
  # springdoc의 servers URL 등 자기 자신을 가리키는 절대 URL이 http://로 잘못 생성된다.
  forward-headers-strategy: framework

spring:
  flyway:
    enabled: true # db/migration의 SQL로 스키마 관리 (Hibernate는 검증만 함)

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 배포 환경(SSM Run Command)에서 RDS 접속 정보를 환경변수로 주입
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate # 운영 DB 스키마는 앱이 바꾸지 않음 (마이그레이션 도구/수동 SQL로 관리)
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI}
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image
              - account_email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-info-authentication-method: header
            user-name-attribute: id

app:
  frontend-url: ${APP_FRONTEND_URL}
  swagger-origin: ${APP_SWAGGER_ORIGIN:https://api.loovi.my}

  auth:
    jwt:
      issuer: klljs
      secret: ${JWT_SECRET}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 1209600

logging:
  level:
    root: info
