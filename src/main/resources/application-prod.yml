server:
  # ALB가 443(HTTPS)을 받아 EC2에는 8080(HTTP)으로 전달한다.
  # X-Forwarded-Proto 등을 신뢰하지 않으면 앱이 스스로를 http로 착각해
  # springdoc의 servers URL 등 자기 자신을 가리키는 절대 URL이 http://로 잘못 생성된다.
  forward-headers-strategy: framework

spring:
  flyway:
    enabled: true # db/migration의 SQL로 스키마 관리 (Hibernate는 검증만 함)

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 배포 환경(SSM Run Command)에서 RDS 접속 정보를 환경변수로 주입
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate # 운영 DB 스키마는 앱이 바꾸지 않음 (마이그레이션 도구/수동 SQL로 관리)
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI}
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image
              - account_email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-info-authentication-method: header
            user-name-attribute: id

app:
  frontend-url: ${APP_FRONTEND_URL}
  swagger-origin: ${APP_SWAGGER_ORIGIN:https://api.loovi.my}

  campaign:
    creative:
      bucket: ${CAMPAIGN_CREATIVE_BUCKET}
      region: ${CAMPAIGN_CREATIVE_REGION:ap-northeast-2}
      public-base-url: ${CAMPAIGN_CREATIVE_PUBLIC_BASE_URL}
      upload-token-secret: ${CAMPAIGN_CREATIVE_UPLOAD_TOKEN_SECRET}
      upload-ttl-seconds: 3600

  auth:
    jwt:
      issuer: klljs
      secret: ${JWT_SECRET}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 1209600
    refresh-cookie:
      # 기본값 Lax - 프론트가 API와 같은 site일 때(운영)는 이 값을 바꿀 필요가 없다.
      # 로컬 프론트(localhost)로 이 서버를 cross-site로 테스트할 때만(issue #31) 배포 시
      # REFRESH_COOKIE_SAME_SITE=None 환경변수로 임시 오버라이드한다 - 실제 배포 전 Lax로 되돌려야 한다.
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}

  upload:
    business-registration:
      # 전부 기본값이 없다 - 주입하지 않으면 기동 자체가 실패한다. 조용히 잘못된 값으로 뜨는 것보다
      # 배포가 실패하는 편이 낫다 (토큰 시크릿이 비면 업로드 토큰을 아무나 위조할 수 있다).
      #
      # 토큰 시크릿을 교체하면 최대 1시간(token-ttl-seconds) 동안 기존 업로드 토큰이 무효가 되어
      # 그 사이 팀 생성을 시도하던 사용자는 재업로드해야 한다 - 교체는 사용량이 적은 시간대에 한다.
      token-secret: ${BUSINESS_REGISTRATION_UPLOAD_TOKEN_SECRET}
      bucket: ${BUSINESS_REGISTRATION_BUCKET}
      ocr-function-name: ${BUSINESS_REGISTRATION_OCR_FUNCTION}

  vision:
    sqs:
      queue-url: ${VISION_SQS_QUEUE_URL}
      consumer-enabled: true

logging:
  level:
    root: info
