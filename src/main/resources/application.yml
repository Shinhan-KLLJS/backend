spring:
  profiles:
    active: local # 로컬 실행 시 기본으로 활성화되는 프로필 (IDE Run 설정 등으로 재정의 가능)

app:
  vision:
    sqs:
      queue-url: ${VISION_SQS_QUEUE_URL:}
      region: ${VISION_SQS_REGION:ap-northeast-2}
      # 기본값은 항상 false다 - 이 값이 true면 실제 운영 SQS 큐를 폴링/삭제하므로,
      # 테스트 실행이나 아무 생각 없는 로컬 기동에서 우연히 켜지면 안 된다.
      # application-prod.yml에서만 명시적으로 true로 켠다.
      consumer-enabled: ${VISION_SQS_CONSUMER_ENABLED:false}
      poll-wait-time-sec: 20
      poll-max-messages: 10

  campaign:
    creative:
      bucket: ${CAMPAIGN_CREATIVE_BUCKET:local-campaign-creatives}
      region: ${CAMPAIGN_CREATIVE_REGION:ap-northeast-2}
      public-base-url: ${CAMPAIGN_CREATIVE_PUBLIC_BASE_URL:https://example.com/local-campaign-creatives}
      upload-token-secret: ${CAMPAIGN_CREATIVE_UPLOAD_TOKEN_SECRET:local-dev-only-campaign-creative-secret}
      upload-ttl-seconds: 3600

