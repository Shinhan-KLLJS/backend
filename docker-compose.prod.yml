services:
  # Spring Boot 애플리케이션 서비스 설정
  # DB는 컨테이너로 띄우지 않고 AWS RDS(MySQL)에 직접 접속합니다 (infra/ 참고)
  spring-app:
    image: jeongheon0808/klljs-app:latest
    container_name: klljs-app
    ports:
      - "8080:8080"
    environment:
      # RDS 엔드포인트 (terraform output rds_endpoint 값)
      SPRING_DATASOURCE_URL: jdbc:mysql://${RDS_ENDPOINT}/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    networks:
      - klljs-network

networks:
  klljs-network:
    driver: bridge
